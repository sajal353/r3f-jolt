name: Release

on:
  push:
    branches: [main, next]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  prerelease:
    name: Publish to next
    needs: verify
    if: github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing authenticates over OIDC and generates provenance
      # automatically; no NPM_TOKEN is involved.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Resolve the next prerelease version
        id: version
        run: echo "version=$(node scripts/next-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Apply the version
        run: pnpm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Publish
        run: npm publish --tag next

      - name: Summary
        run: |
          {
            echo "Published \`r3f-jolt@${{ steps.version.outputs.version }}\` to the **next** tag."
            echo
            echo '```bash'
            echo 'pnpm add r3f-jolt@next'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish to latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Read the version
        id: version
        run: |
          {
            echo "name=$(node -p "require('./package.json').name")"
            echo "version=$(node -p "require('./package.json').version")"
          } >> "$GITHUB_OUTPUT"

      # main publishes the exact version in package.json, so a merge that does
      # not bump it is a no-op rather than a duplicate-version failure.
      - name: Has this version already shipped?
        id: check
        run: |
          if [ -n "$(npm view ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} version 2>/dev/null)" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.published == 'false'
        run: pnpm run build

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --tag latest

      - name: Tag and draft the GitHub release
        if: steps.check.outputs.published == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.published }}" = "true" ]; then
            echo "\`${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}\` is already on npm — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Released \`${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}\` to **latest**, tagged \`v${{ steps.version.outputs.version }}\`."
              echo
              echo '```bash'
              echo 'pnpm add r3f-jolt'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
